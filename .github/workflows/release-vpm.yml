name: Build VPM Listing & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      PKG_DIR: Packages/io.github.hitomiruneko.mesh-uvmaskcuttool
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read package metadata
        id: meta
        run: |
          PKG_NAME=$(python3 -c "import json; print(json.load(open('${PKG_DIR}/package.json'))['name'])")
          PKG_VERSION=$(python3 -c "import json; print(json.load(open('${PKG_DIR}/package.json'))['version'])")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${PKG_VERSION}"
          fi
          echo "name=${PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "zip=${PKG_NAME}-${PKG_VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Build package zip
        run: |
          (cd "${PKG_DIR}" && zip -r "${GITHUB_WORKSPACE}/${{ steps.meta.outputs.zip }}" .)
          ZIP_SHA256=$(sha256sum "${{ steps.meta.outputs.zip }}" | awk '{print $1}')
          echo "sha256=${ZIP_SHA256}" >> "$GITHUB_OUTPUT"

          python3 - <<'PYEOF'
          import json, os
          pkg_path = os.path.join(os.environ["PKG_DIR"], "package.json")
          with open(pkg_path, "r", encoding="utf-8") as f:
              data = json.load(f)
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = "${{ steps.meta.outputs.tag }}"
          zip_name = "${{ steps.meta.outputs.zip }}"
          data["url"] = f"https://github.com/{repo}/releases/download/{tag}/{zip_name}"
          data["zipSHA256"] = "${{ steps.meta.outputs.sha256 }}"
          with open("vpm-package.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PYEOF

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ZIP="${{ steps.meta.outputs.zip }}"
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "MeshUVMaskCutTool ${TAG}" \
              --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          gh release upload "${TAG}" "${ZIP}" "vpm-package.json" --clobber

      - name: Generate VPM index.json and landing page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public
          python3 - <<'PYEOF'
          import html, json, os, urllib.request, urllib.parse

          repo = os.environ["GITHUB_REPOSITORY"]
          owner, repo_name = repo.split("/", 1)
          pages_url = f"https://{owner}.github.io/{repo_name}/"
          index_url = f"{pages_url}index.json"
          vcc_url = "vcc://vpm/addRepo?url=" + urllib.parse.quote(index_url, safe="")

          versions = {}
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "vpm-listing-builder",
          }

          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases?per_page=100", headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  releases = json.loads(resp.read().decode("utf-8"))
          except Exception:
              releases = []

          for rel in releases:
              if rel.get("draft"):
                  continue
              for asset in rel.get("assets", []):
                  if asset.get("name") == "vpm-package.json":
                      areq = urllib.request.Request(asset["browser_download_url"], headers={"User-Agent": "vpm-listing-builder"})
                      with urllib.request.urlopen(areq) as aresp:
                          pdata = json.loads(aresp.read().decode("utf-8"))
                      ver = pdata.get("version")
                      if ver:
                          versions[ver] = pdata

          with open("vpm-package.json", "r", encoding="utf-8") as f:
              current_pkg = json.load(f)
          pkg_name = current_pkg["name"]
          if not versions and os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              versions[current_pkg["version"]] = current_pkg

          listing = {
              "name": "MeshUVMaskCutTool VPM Repository",
              "author": owner,
              "url": index_url,
              "id": f"io.github.{owner.lower()}.mesh-uvmaskcuttool.repo",
              "packages": {
                  pkg_name: {
                      "versions": versions
                  }
              }
          }

          with open("public/index.json", "w", encoding="utf-8") as f:
              json.dump(listing, f, ensure_ascii=False, indent=2)

          ver_items = "".join(
              f"<li><code>{html.escape(v)}</code> — <a href='{html.escape(d.get('url', '#'))}'>Download ZIP</a></li>"
              for v, d in sorted(versions.items(), reverse=True)
          ) or "<li>No tagged releases yet. Push a <code>v*</code> tag (e.g. <code>v1.0.0</code>) to publish.</li>"

          page = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>MeshUVMaskCutTool — VPM Repository</title>
            <style>
              :root {{ color-scheme: dark light; --bg:#0f1117; --card:#181b24; --border:#2b3142; --fg:#e8ecf5; --muted:#9aa4b8; --accent:#4c9aff; }}
              @media (prefers-color-scheme: light) {{ :root {{ --bg:#f5f7fb; --card:#ffffff; --border:#dde2ec; --fg:#1d2433; --muted:#5a657c; --accent:#2563eb; }} }}
              body {{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; }}
              .wrap {{ max-width:780px; margin:48px auto; padding:0 20px; }}
              .card {{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px; margin-bottom:20px; }}
              h1 {{ margin:0 0 8px; font-size:28px; }}
              p {{ color:var(--muted); margin:8px 0 16px; }}
              .actions {{ display:flex; flex-wrap:wrap; gap:12px; margin:20px 0; }}
              .btn {{ display:inline-block; padding:12px 20px; border-radius:10px; font-weight:600; text-decoration:none; cursor:pointer; border:1px solid var(--border); }}
              .btn-primary {{ background:var(--accent); color:#fff; border-color:var(--accent); }}
              .btn-ghost {{ background:transparent; color:var(--fg); }}
              code {{ background:rgba(127,127,127,0.16); padding:2px 6px; border-radius:5px; font-size:0.92em; }}
              ul {{ padding-left:20px; }}
              a {{ color:var(--accent); }}
            </style>
          </head>
          <body>
            <div class="wrap">
              <div class="card">
                <h1>MeshUVMaskCutTool</h1>
                <p>VRChat Avatar Mesh Cutting, Material Slot Splitting, Interactive UV Editor &amp; UV Mask Generator (Unity 2022.3 + NDMF + Modular Avatar).</p>
                <div class="actions">
                  <a class="btn btn-primary" href="{html.escape(vcc_url)}">Add to VCC / 添加到 VCC / VCC に追加</a>
                  <button class="btn btn-ghost" onclick="navigator.clipboard.writeText('{html.escape(index_url)}').then(()=>this.textContent='Copied!')">Copy Listing URL</button>
                  <a class="btn btn-ghost" href="https://github.com/{html.escape(repo)}">GitHub Repository</a>
                </div>
                <p>Listing URL: <code>{html.escape(index_url)}</code></p>
              </div>
              <div class="card">
                <h2>Available Versions</h2>
                <ul>{ver_items}</ul>
              </div>
              <div class="card">
                <h2>Credits &amp; License (MIT)</h2>
                <p>Created by <strong>@{html.escape(owner)}</strong>. Based on <a href="https://github.com/vrcyue/MeshUVCutTool">MeshUVCutTool</a> (@vrcyue) and <a href="https://github.com/HhotateA/AvatarModifyTools">AvatarModifyTools</a> (@HhotateA_xR).</p>
              </div>
            </div>
          </body>
          </html>
          """
          with open("public/index.html", "w", encoding="utf-8") as f:
              f.write(page)
          PYEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    needs: build-and-release
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
